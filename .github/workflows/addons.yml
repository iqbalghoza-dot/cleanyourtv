
name: Build Prayer Times Ponjong

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "addons/prayer-times/**"
      - ".github/workflows/addons.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Prayer Times APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Check Prayer Times Source
        run: |
          test -f addons/prayer-times/gradlew
          test -f addons/prayer-times/app/build.gradle
          test -f addons/prayer-times/app/src/main/res/values/config.xml
          echo "Prayer Times source found"

      - name: Build Release APK
        run: |
          cd addons/prayer-times
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK
        run: |
          find addons/prayer-times/app/build/outputs/apk \
            -type f -name "*.apk" -print
          test -n "$(find addons/prayer-times/app/build/outputs/apk \
            -type f -name "*.apk" -print -quit)"

      - name: Upload Prayer Times APK
        uses: actions/upload-artifact@v4
        with:
          name: Prayer-Times-Ponjong
          path: addons/prayer-times/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
