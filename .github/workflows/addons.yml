
name: Build Prayer Times Ponjong

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "addons/prayer-times/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Prayer Times
        run: |
          cd addons/prayer-times
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prayer-Times-Ponjong
          path: addons/prayer-times/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
